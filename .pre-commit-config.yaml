default_stages:
 - pre-commit
 - pre-merge-commit

repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.3.0
    hooks:
      - id: commitizen
        stages:
          - commit-msg
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-format
        name: ruff format
      - id: ruff
        name: ruff format and autofix
        args: [--fix]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        entry: bash -c "pip3 install --group dev -e '.[cron,dishka,opentelemetry,psycopg,sqlalchemy]' && mypy --package schedex"
        pass_filenames: false
